  <polygon points="24,20 18,24 20,30 26,26"/>
  <polygon points="40,20 46,24 44,30 38,26"/>
  <!-- bottom left -->
  <polygon points="16,34 23,40 24,48 22,54 10,54 8,48 9,40"/>
  <polygon points="9,44 4,47 6,52 11,49"/>
  <!-- bottom right -->
  <polygon points="48,34 55,40 56,48 54,54 42,54 40,48 41,40"/>
  <polygon points="55,44 60,47 58,52 53,49"/>
</g>
</svg>
