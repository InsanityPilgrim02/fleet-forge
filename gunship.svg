<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" color="#f0a93a" role="img">
<title>Gunship Squadron</title>
<title>Gunship Squadron</title>
<mask id="m-gunship">
  <rect width="64" height="64" fill="#fff"/>
  <g fill="#000">
    <!-- top ship details -->
    <rect x="30" y="14" width="4" height="8" rx="1"/>
    <rect x="28" y="24" width="3" height="3" rx="0.5"/>
    <rect x="33" y="24" width="3" height="3" rx="0.5"/>
    <!-- bottom left -->
    <rect x="14.5" y="40" width="3.5" height="6" rx="1"/>
    <rect x="13" y="48" width="2.5" height="2.5" rx="0.5"/>
    <rect x="17" y="48" width="2.5" height="2.5" rx="0.5"/>
    <!-- bottom right -->
    <rect x="46" y="40" width="3.5" height="6" rx="1"/>
    <rect x="44.5" y="48" width="2.5" height="2.5" rx="0.5"/>
    <rect x="48.5" y="48" width="2.5" height="2.5" rx="0.5"/>
  </g>
</mask>
<g fill="currentColor" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" mask="url(#m-gunship)">
  <!-- top gunship - more armored with side pods -->
