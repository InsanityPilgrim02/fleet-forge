<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" color="#f0a93a" role="img">
<title>Fighter Squadron</title>
<title>Fighter Squadron</title>
<mask id="m-fighter">
  <rect width="64" height="64" fill="#fff"/>
  <g fill="#000">
    <!-- top fighter -->
    <rect x="30.5" y="14" width="3" height="6" rx="1"/>
    <rect x="29" y="22" width="2.5" height="2.5" rx="0.5"/>
    <rect x="32.5" y="22" width="2.5" height="2.5" rx="0.5"/>
    <!-- bottom left -->
    <rect x="15.5" y="40" width="3" height="5" rx="1"/>
    <rect x="14" y="47" width="2.5" height="2.5" rx="0.5"/>
    <rect x="17.5" y="47" width="2.5" height="2.5" rx="0.5"/>
    <!-- bottom right -->
    <rect x="45.5" y="40" width="3" height="5" rx="1"/>
    <rect x="44" y="47" width="2.5" height="2.5" rx="0.5"/>
    <rect x="47.5" y="47" width="2.5" height="2.5" rx="0.5"/>
  </g>
</mask>
<g fill="currentColor" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" mask="url(#m-fighter)">
  <!-- top fighter - angular with slight side detail -->
  <polygon points="32,7 42,26 36,24 32,28 28,24 22,26"/>
  <!-- bottom left -->
  <polygon points="17,32 27,51 21,49 17,53 13,49 7,51"/>
  <!-- bottom right -->
  <polygon points="47,32 57,51 51,49 47,53 43,49 37,51"/>
</g>
</svg>
