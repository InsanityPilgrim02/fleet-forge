function icon(t,col){const im=IMG[t];if(!im)return null;const key=t+col+ICFG[t].tint;if(icc[key])return icc[key];const S=128,o=document.createElement('canvas');o.width=o.height=S;const c=o.getContext('2d'),f=Math.min(S/im.width,S/im.height),w=im.width*f,h=im.height*f;c.drawImage(im,(S-w)/2,(S-h)/2,w,h);if(ICFG[t].tint){c.globalCompositeOperation='source-in';c.fillStyle=col;c.fillRect(0,0,S,S)}return icc[key]=o}
function icFile(t,file,done){if(!file||!/^image\/png$/.test(file.type)&&!/\.png$/i.test(file.name)){alert('Please choose a PNG file.');return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const f=Math.min(1,256/Math.max(im.width,im.height)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(im.width*f));o.height=Math.max(1,Math.round(im.height*f));const c=o.getContext('2d');c.drawImage(im,0,0,o.width,o.height);
  const d=c.getImageData(0,0,o.width,o.height).data,cn=[0,o.width-1,(o.height-1)*o.width,o.height*o.width-1].map(i=>d[i*4+3]);
